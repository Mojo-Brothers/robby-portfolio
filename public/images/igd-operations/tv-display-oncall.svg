<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <rect width="960" height="540" fill="#020617"/>
  
  <!-- TV Monitor Frame / Header -->
  <rect x="30" y="24" width="900" height="70" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="58" cy="59" r="14" fill="#E11D48"/>
  <path d="M52 59H64M58 53V65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="84" y="55" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="bold">INSTALASI GAWAT DARURAT (IGD)</text>
  <text x="84" y="74" fill="#94A3B8" font-family="sans-serif" font-size="12">LAYAR INFORMASI JADWAL DOKTER SPESIALIS ON-CALL</text>

  <!-- Digital Clock WIB -->
  <rect x="740" y="36" width="170" height="46" rx="8" fill="#1E293B"/>
  <text x="756" y="66" fill="#38BDF8" font-family="monospace" font-size="20" font-weight="bold">09:14:22 <tspan font-size="12" fill="#94A3B8">WIB</tspan></text>

  <!-- Doctor Cards Grid -->
  <g transform="translate(30, 110)">
    <!-- Card 1: Bedah Umum -->
    <rect width="286" height="320" rx="12" fill="#0F172A" stroke="#334155"/>
    <rect x="18" y="18" width="80" height="22" rx="4" fill="#059669" fill-opacity="0.2"/>
    <text x="26" y="33" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">AKTIF JAGA</text>
    
    <circle cx="143" cy="100" r="36" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
    <text x="143" y="106" text-anchor="middle" fill="#2DD4BF" font-family="sans-serif" font-size="20" font-weight="bold">dr. B</text>
    
    <text x="143" y="165" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">dr. Bambang, Sp.B</text>
    <text x="143" y="185" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">Spesialis Bedah Umum</text>
    
    <rect x="20" y="210" width="246" height="40" rx="8" fill="#1E293B"/>
    <text x="32" y="234" fill="#E2E8F0" font-family="sans-serif" font-size="12">Shift: Pagi (07.00 - 15.00)</text>
    <rect x="20" y="260" width="246" height="40" rx="8" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-opacity="0.3"/>
    <text x="32" y="284" fill="#34D399" font-family="monospace" font-size="12">Status: Berada di Tempat</text>

    <!-- Card 2: Anak -->
    <rect x="306" width="286" height="320" rx="12" fill="#0F172A" stroke="#334155"/>
    <rect x="324" y="18" width="80" height="22" rx="4" fill="#059669" fill-opacity="0.2"/>
    <text x="332" y="33" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">AKTIF JAGA</text>

    <circle cx="449" cy="100" r="36" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
    <text x="449" y="106" text-anchor="middle" fill="#2DD4BF" font-family="sans-serif" font-size="20" font-weight="bold">dr. S</text>

    <text x="449" y="165" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">dr. Siti, Sp.A</text>
    <text x="449" y="185" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">Spesialis Kesehatan Anak</text>

    <rect x="326" y="210" width="246" height="40" rx="8" fill="#1E293B"/>
    <text x="338" y="234" fill="#E2E8F0" font-family="sans-serif" font-size="12">Shift: Pagi (07.00 - 15.00)</text>
    <rect x="326" y="260" width="246" height="40" rx="8" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-opacity="0.3"/>
    <text x="338" y="284" fill="#34D399" font-family="monospace" font-size="12">Status: On-Call 15 Menit</text>

    <!-- Card 3: Penyakit Dalam -->
    <rect x="612" width="288" height="320" rx="12" fill="#0F172A" stroke="#334155"/>
    <rect x="630" y="18" width="84" height="22" rx="4" fill="#D97706" fill-opacity="0.2"/>
    <text x="638" y="33" fill="#FBBF24" font-family="monospace" font-size="10" font-weight="bold">OVERRIDE</text>

    <circle cx="756" cy="100" r="36" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="756" y="106" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="20" font-weight="bold">dr. R</text>

    <text x="756" y="165" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">dr. Rahmat, Sp.PD</text>
    <text x="756" y="185" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="12">Spesialis Penyakit Dalam</text>

    <rect x="632" y="210" width="248" height="40" rx="8" fill="#1E293B"/>
    <text x="644" y="234" fill="#E2E8F0" font-family="sans-serif" font-size="12">Shift: Pagi (Pengganti dr. H)</text>
    <rect x="632" y="260" width="248" height="40" rx="8" fill="#D97706" fill-opacity="0.1" stroke="#D97706" stroke-opacity="0.3"/>
    <text x="644" y="284" fill="#FBBF24" font-family="monospace" font-size="12">Status: Penggantian Darurat</text>
  </g>

  <!-- Running Text Footer -->
  <rect x="30" y="450" width="900" height="50" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <rect x="44" y="462" width="70" height="26" rx="6" fill="#0D9488"/>
  <text x="54" y="479" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">INFORMASI</text>
  <text x="126" y="480" fill="#E2E8F0" font-family="sans-serif" font-size="13">Prioritas penanganan IGD ditentukan berdasarkan kegawatdaruratan medis pasien (Triase ESI 1–5), bukan urutan kedatangan.</text>
</svg>
