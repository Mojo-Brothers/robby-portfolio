  <text x="36" y="342" fill="#94A3B8" font-family="monospace" font-size="10">GPS Coordinates</text>

  <rect x="206" y="296" width="174" height="70" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="222" y="322" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">Selesai Trip</text>
  <text x="222" y="342" fill="#14B8A6" font-family="monospace" font-size="10">Submit Catatan KM</text>

  <!-- Monthly Stats Container -->
  <rect x="20" y="380" width="360" height="230" rx="14" fill="#1E293B" stroke="#334155"/>
  <text x="36" y="406" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="bold">Rekapitulasi Armada Bulan Ini</text>
  
  <!-- Stat rows -->
  <rect x="36" y="422" width="328" height="42" rx="8" fill="#0F172A"/>
  <text x="48" y="447" fill="#E2E8F0" font-family="sans-serif" font-size="12">Total Perjalanan Jemput/Rujuk</text>
  <text x="300" y="447" fill="#2DD4BF" font-family="monospace" font-size="13" font-weight="bold">48 Trip</text>

  <rect x="36" y="472" width="328" height="42" rx="8" fill="#0F172A"/>
  <text x="48" y="497" fill="#E2E8F0" font-family="sans-serif" font-size="12">Akumulasi Jarak Tempuh</text>
  <text x="290" y="497" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">942.8 KM</text>

  <rect x="36" y="522" width="328" height="42" rx="8" fill="#0F172A"/>
  <text x="48" y="547" fill="#E2E8F0" font-family="sans-serif" font-size="12">Ekspor Laporan (Excel / PDF)</text>
  <text x="300" y="547" fill="#A7F3D0" font-family="monospace" font-size="11">Ready</text>

  <rect x="36" y="574" width="328" height="22" rx="6" fill="#334155"/>
  <text x="46" y="589" fill="#94A3B8" font-family="monospace" font-size="10">SYNTHETIC FIELD WORKSTATION DEMO</text>
